window.syncQueue = [];

function loadSyncQueue(){
  if(!window.centerCode) return;
  const raw = localStorage.getItem("mdr_sync_queue_" + window.centerCode) || localStorage.getItem("sync_queue_" + window.centerCode);
  if(raw){ try{ window.syncQueue = JSON.parse(raw); }catch(_){ window.syncQueue = []; } }
}

function persistQueue(){
  if(!window.centerCode) return;
  localStorage.setItem("mdr_sync_queue_" + window.centerCode, JSON.stringify(window.syncQueue));
}

function addToSyncQueue(data){
  window.syncQueue.push({action:'SAVE', data, centerCode:window.centerCode, sajoName:window.currentSajo, timestamp:Date.now(), retries:0});
  persistQueue();
  updateSyncStatus();
}

window.processSyncQueue = async function(){
  if(isSyncing || !isOnline || window.syncQueue.length === 0 || !_hasURL()) return;
  isSyncing = true;
  let successCount = 0;
  for(let i = 0; i < window.syncQueue.length; i++){
    const ok = await cloudSave(window.syncQueue[i].data, 2);
    if(ok){ successCount++; window.syncQueue.splice(i, 1); i--; }
    else { window.syncQueue[i].retries++; if(window.syncQueue[i].retries > 5){ window.syncQueue.splice(i, 1); i--; } }
    await new Promise(r => setTimeout(r, 600));
  }
  persistQueue();
  isSyncing = false;
  if(successCount > 0) setStatus(`✅ ${successCount} synced`, "#1b8f57");
  updateSyncStatus();
};

window.saveState = async function(){

  localStorage.setItem("mdr_local_" + window.centerCode, JSON.stringify(payload));
  
  if(!_hasURL()){ setStatus("💾 Local only", "#e67e22"); return; }
  
  if(isOnline){
    const ok = await cloudSave(payload, 3);
    if(!ok){ addToSyncQueue(payload); setStatus("📤 Queued", "#f59e0b"); }
  } else {
    addToSyncQueue(payload);
    setStatus("📤 Offline queued", "#f59e0b");
  }
};

async function cloudSave(data, maxRetries = 3){
  for(let attempt = 1; attempt <= maxRetries; attempt++){
    try{
      setStatus(`⏳ Saving (${attempt}/${maxRetries})...`, "#2563a8");
      const ctrl = new AbortController();
      const tid = setTimeout(() => ctrl.abort(), 10000);
      
      const res = await fetch(APPS_SCRIPT_URL, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
          action: "SAVE",
          centerCode: window.centerCode,
          sajoName: window.currentSajo,
          inv: data.inv,
          ben: data.ben,
          timestamp: data.timestamp
        }),
        signal: ctrl.signal
      });
      clearTimeout(tid);
      
      if(!res.ok) throw new Error(`HTTP ${res.status}`);
      const result = await res.json();
      
      if(result.success === true || result.status === "ok"){
        setStatus(`✅ Saved ${new Date().toLocaleTimeString('gu-IN')}`, "#1b8f57");
        return true;
      } else {
        throw new Error(result.message || result.msg || "Rejected");
      }
    } catch(err){
      console.warn(`Attempt ${attempt} failed:`, err.message);
      if(attempt === maxRetries) return false;
      await new Promise(r => setTimeout(r, 1000 * attempt));
    }
  }
  return false;
}

window.syncCloud = async function(){
  if(!_hasURL() || !window.centerCode) return;
  setStatus("⏳ Loading...", "#2563a8");
  try{
    const url = new URL(APPS_SCRIPT_URL);
    url.searchParams.set("action", "LOAD");
    url.searchParams.set("centerCode", window.centerCode);
    url.searchParams.set("sajoName", window.currentSajo);
    
    const ctrl = new AbortController();
    const tid = setTimeout(() => ctrl.abort(), 12000);
    const res = await fetch(url.toString(), {signal: ctrl.signal});
    clearTimeout(tid);
    
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    
    if(data.status === "error") throw new Error(data.msg || "Server error");
    if(data.status === "new_user"){
      setStatus(`🆕 New: ${window.centerCode}`, "#2563a8");
      return;
    }
    if(data.inv || data.ben){
      if(data.inv) window.state.inv = data.inv;
      if(data.ben) window.state.ben = data.ben;
      localStorage.setItem("mdr_local_" + window.centerCode, JSON.stringify({
        inv: window.state.inv, ben: window.state.ben, sajoName: window.currentSajo, timestamp: new Date().toISOString()
      }));
      setStatus(`☁️ Loaded`, "#1b8f57");
      invalidateCache();
      render();
    } else {
      setStatus("☁️ No data", "#2563a8");
    }
  } catch(err){
    console.error("syncCloud error:", err);
    const msg = err.name === "AbortError" ? "Timeout" : err.message;
    setStatus(`⚠️ Load failed: ${msg}`, "#e67e22");
  }
};

function calcUsage(dow, n){
  n = Number(n) || 0;
  const u = {};
  ITEMS.forEach(it => { u[it.id]=0; u[it.id+"M"]=0; u[it.id+"A"]=0; u[it.id+"nM"]=0; u[it.id+"nA"]=0; });
  if(!n || dow === 0) return u;
  u.telM = 5*n; u.telnM = n;
  if(dow===1||dow===3||dow===4||dow===5||dow===6){ u.ghauM=30*n; u.ghaunM=n; }
  if(dow===2){ u.chokhaM=30*n; u.chokhanM=n; }
  u.telA = 8*n; u.telnA = n;
  if(dow===1||dow===2||dow===5){ u.ghauA=50*n; u.ghaunA=n; }
  if(dow===3||dow===4||dow===6){ u.chokhaA=50*n; u.chokhanA=n; }
  if(dow===2||dow===4||dow===5){ u.chanaA=20*n; u.chananA=n; }
  if(dow===1||dow===3){ u.dalA=20*n; u.dalnA=n; }
  if(dow===6){ u.chanadalA=20*n; u.chanadalnA=n; }
  ITEMS.forEach(it => { u[it.id] = u[it.id+"M"] + u[it.id+"A"]; });
  return u;
}

const morU = (id,u) => u[id+"M"] || 0;
const aftU = (id,u) => u[id+"A"] || 0;

function dayHint(d){
  const h = ["🔴 રવિ — રજા","સ:ઘઉ30+તે5 | બ:ઘઉ50+દા20+તે8","સ:ચો30+તે5 | બ:ઘઉ50+ચ20+તે8","સ:ઘઉ30+તે5 | બ:ચો50+દા20+તે8","સ:ઘઉ30+તે5 | બ:ચો50+ચ20+તે8","સ:ઘઉ30+તે5 | બ:ઘઉ50+ચ20+તે8","સ:ઘઉ30+તે5 | બ:ચો50+ચદ20+તે8"];
  return h[d] || "";
}

const dkf = (y,m,d) => `${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;

let _muCache = null, _muCacheKey = "";
function calcMonthUsage(y,m,ben){
  const key = `${y}-${m}-${JSON.stringify(ben)}`;
  if(_muCache && _muCacheKey === key) return _muCache;
  const total = {totalN:0, days:0};
  ITEMS.forEach(it => { total[it.id]=0; total[it.id+"M"]=0; total[it.id+"A"]=0; total[it.id+"nM"]=0; total[it.id+"nA"]=0; });
  const dim = new Date(y,m+1,0).getDate();
  for(let d=1; d<=dim; d++){
    const k = dkf(y,m,d);
    const n = Number(ben[k] || 0);
    if(!n) continue;
    const u = calcUsage(new Date(y,m,d).getDay(), n);
    ITEMS.forEach(it => {
      total[it.id]+=u[it.id]; total[it.id+"M"]+=u[it.id+"M"]; total[it.id+"A"]+=u[it.id+"A"];
      total[it.id+"nM"]+=u[it.id+"nM"]; total[it.id+"nA"]+=u[it.id+"nA"];
    });
    total.totalN += n; total.days++;
  }
  _muCache = total; _muCacheKey = key;
  return total;
}

function invalidateCache(){ _muCache = null; _muCacheKey = ""; }
const fmt = (n,d=0) => (n==null||isNaN(n)) ? "0" : Number(n).toFixed(d);

let _renderPending = false;
function render(){
  if(_renderPending) return;
  _renderPending = true;
  
  requestAnimationFrame(() => {
    _renderPending = false;
    const app = document.getElementById('app');
    
    console.log("render() called, app element:", app ? "found" : "NOT FOUND");
    
    if(!app){
      console.error("CRITICAL: #app element not found!");
      return;
    }
    
    if(!window.centerCode){
      console.log("No centerCode, rendering setup");
      const nav = document.getElementById("nav");
      const sync = document.getElementById("syncStatus");
      if(nav) nav.style.display = "none";
      if(sync) sync.style.display = "none";
      app.innerHTML = renderSetupPage();
      return;
    }
    
    document.querySelectorAll('#nav button').forEach(b => {
      b.classList.toggle('active', Number(b.dataset.tab) === window.state.tab);
    });
    
    const curMU = calcMonthUsage(window.state.calY, window.state.calM, window.state.ben);
    let html = "";
    
    try {
      if(window.state.tab === 0) html = renderInventoryPage(curMU);
      else if(window.state.tab === 1) html = renderCalendarPage();
      else if(window.state.tab === 2) html = renderDashboardPage(curMU);
      else if(window.state.tab === 3) html = renderReportPage();
      else if(window.state.tab === 5) html = renderBillPage();
      else if(window.state.tab === 4) html = renderAdminPage();
      
      html += renderModal();
      app.innerHTML = html;
      
      if(window.state.modal){
        const inp = document.getElementById('modalInput');
        if(inp){ inp.focus(); inp.select(); }
      }
      if(window.state.tab === 3 && !window.state.modal) initReportZoom();
      
    } catch(err) {
      console.error("Render error:", err);
      app.innerHTML = `<div class="container"><div class="card"><div class="section-head" style="background:#cc3d3d">❌ Error</div><div class="section-body"><p>${err.message}</p><pre style="font-size:10px;overflow:auto">${err.stack}</pre></div></div></div>`;
    }
  });
}

function renderCalendarPage(){
  const y = window.state.calY, m = window.state.calM;
  const first = new Date(y,m,1).getDay();
  const dim = new Date(y,m+1,0).getDate();
  const today = new Date();
  let cells = "", monthN = 0, monthD = 0;
  
  for(let i=0; i<first; i++) cells += `<div class="cal-cell empty"></div>`;
  for(let d=1; d<=dim; d++){
    const k = dkf(y,m,d);
    const n = Number(window.state.ben[k] || 0);
    const dow = new Date(y,m,d).getDay();
    const isToday = (d===today.getDate() && m===today.getMonth() && y===today.getFullYear());
    if(n>0){ monthN += n; monthD++; }
    cells += `<div class="cal-cell ${dow===0?'sunday':''} ${isToday?'today':''}" data-day="${d}">
      <div class="d">${d}</div>
      <div class="n ${n===0?'zero':''}">${n>0?n:'—'}</div>
    </div>`;
  }
  
  const heads = DAYS_SHORT.map((d,i) => `<div class="cal-day-head ${i===0?'sun':''}">${d}</div>`).join("");
  
  return `<div class="container tab-content">
    <div class="card">
      <div class="section-head">📅 કેલેન્ડર</div>
      <div class="cal-head">
        <button id="prevM">‹</button>
        <h3>${MONTHS_FULL[m]} ${y}</h3>
        <button id="nextM">›</button>
      </div>
      <div class="cal-grid">${heads}${cells}</div>
      <div class="cal-totals">
        <div>કુલ દિવસ<b>${monthD}</b></div>
        <div>કુલ લાભાર્થી<b>${monthN}</b></div>
        <div>સરેરાશ/દિ.<b>${monthD?fmt(monthN/monthD,1):0}</b></div>
      </div>
    </div>
  </div>`;
}
